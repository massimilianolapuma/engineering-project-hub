# Reusable workflow — part of this repository's CI building blocks (rw-*).
# ==============================================================================
# Reusable — Engineering Project Hub: collect + build + deploy to Cloudflare Pages
# ==============================================================================
#
# Purpose:  Runs the hub (this public repository, at a pinned ref) against the
#           configuration of the CALLING repository — typically a private
#           "deploy" repository holding the real catalog and the secrets — and
#           publishes the site on Cloudflare Pages, protected by Cloudflare Access.
#           Because everything runs in the caller's workflow run, artifacts,
#           logs and job summaries inherit the caller's (private) visibility.
#
# Jobs (trust boundaries):
#   verify  — no permissions, no secrets: hub-ref must be the commit of a
#             release tag (v*) of the hub repository. Release tags are protected
#             (ruleset "release-tags": only admins create them), so only released
#             code ever runs next to the credentials. Other commits are refused.
#   collect — the ONLY job with GitHub read credentials (GitHub App / PAT):
#             validate config → collect → validate snapshots → artifact
#   build   — no secrets, no write permission: caller's policies.yaml (read
#             only, explained on "How to read") → npm ci → astro build → SBOM →
#             secret scan → artifact "site"
#   deploy  — only the Cloudflare token: wrangler pages deploy (no hub code)
#
# Caller example (private deploy repository):
#   jobs:
#     hub:
#       permissions:
#         contents: read
#       uses: massimilianolapuma/engineering-project-hub/.github/workflows/rw-hub-cloudflare-deploy.yml@<commit-sha> # vX.Y.Z
#       with:
#         hub-ref: <same commit-sha> # must be the commit of a vX.Y.Z tag
#         cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
#         cloudflare-project: engineering-project-hub
#         site-url: https://hub.example.com
#       secrets:
#         GH_APP_ID: ${{ secrets.GH_APP_ID }}
#         GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
#         GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#         # Optional external providers (<config-path>/providers.yaml enables them; all off
#         # by default). Pass only the ones you enabled; the values are never printed:
#         SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
#         HARBOR_ROBOT_NAME: ${{ secrets.HARBOR_ROBOT_NAME }}
#         HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
#         ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
#
# Cloudflare Access must cover the custom domain AND <project>.pages.dev and
# *.<project>.pages.dev, otherwise the preview hostnames bypass the login
# (see docs/operations.md → Protected hosting).
#
# Lint: actionlint .github/workflows/rw-hub-cloudflare-deploy.yml
# ==============================================================================

name: Reusable — Hub collect + build + Cloudflare Pages deploy [host]

on:
  workflow_call:
    inputs:
      hub-ref:
        description: 'Full commit SHA of a hub release tag (vX.Y.Z); other commits are refused'
        type: string
        required: true
      config-path:
        description: 'Directory of the catalog in the CALLING repository (catalog.yaml, projects/, policies.yaml)'
        type: string
        default: 'config'
      cloudflare-account-id:
        description: 'Cloudflare account id (not a secret)'
        type: string
        required: true
      cloudflare-project:
        description: 'Cloudflare Pages project name'
        type: string
        required: true
      site-url:
        description: 'Public URL of the protected site (e.g. https://hub.example.com)'
        type: string
        required: true
      catalog-repository:
        description: 'owner/name targeted by the catalog editor (default: the calling repository)'
        type: string
        default: ''
      deploy-environment:
        description: 'GitHub environment of the calling repository used by the deploy job'
        type: string
        default: 'production'
      notifications:
        description: "Teams notifications after deploy: '' (off), 'dry-run' or 'send' (docs/notifications.md)"
        type: string
        default: ''
    secrets:
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_READ_TOKEN:
        required: false
      SONARQUBE_TOKEN:
        required: false
      HARBOR_ROBOT_NAME:
        required: false
      HARBOR_ROBOT_SECRET:
        required: false
      ARGOCD_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: true
      TEAMS_WEBHOOK_URL:
        required: false
    outputs:
      deployment-url:
        description: 'URL printed by wrangler for this deployment'
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read

env:
  HUB_REPOSITORY: massimilianolapuma/engineering-project-hub

jobs:
  # ==========================================================================
  # verify — only released hub code runs (no permissions, no secrets)
  # ==========================================================================
  verify:
    name: Verify hub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # [template-injection] inputs mapped to env and validated before any use.
      - name: Validate inputs
        shell: bash
        env:
          HUB_REF: ${{ inputs.hub-ref }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          [[ "$HUB_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::hub-ref must be a full 40-character commit SHA"; exit 1; }
          [[ "$CONFIG_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$CONFIG_PATH" != *..* ]] || { echo "::error::invalid config-path"; exit 1; }

      # Public repository: anonymous ls-remote, no token involved.
      - name: Require a release tag commit
        id: release
        shell: bash
        env:
          HUB_REF: ${{ inputs.hub-ref }}
        run: |
          tag=$(git ls-remote --tags "https://github.com/${HUB_REPOSITORY}.git" 'refs/tags/v*' \
            | awk -v sha="$HUB_REF" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
          if [[ -z "$tag" ]]; then
            echo "::error::hub-ref ${HUB_REF} is not the commit of a release tag (v*) of ${HUB_REPOSITORY}"
            exit 1
          fi
          echo "Hub release ${tag} (${HUB_REF})" >> "$GITHUB_STEP_SUMMARY"
          { echo "sha=${HUB_REF}"; echo "tag=${tag}"; } >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # collect — the only job holding GitHub read credentials
  # ==========================================================================
  collect:
    name: Collect
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout of the calling repository's configuration
      actions: read # restores this repository's own hub-history artifact
    defaults:
      run:
        shell: bash
        working-directory: hub
    steps:
      - name: Checkout hub (verified release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HUB_REPOSITORY }}
          ref: ${{ needs.verify.outputs.sha }}
          path: hub
          persist-credentials: false

      - name: Checkout configuration (calling repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy
          sparse-checkout: ${{ inputs.config-path }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        env:
          CONFIG_DIR: ${{ github.workspace }}/deploy/${{ inputs.config-path }}
        run: npx tsx scripts/validate-config.ts "$CONFIG_DIR"

      # Restores the previous history from this repository's own newest "hub-history" artifact
      # (default branch, this calling workflow or the hub's own, trusted events only).
      # Only the workflow GITHUB_TOKEN (actions: read); collector secrets are not passed.
      - name: Restore previous history
        id: history
        # A crash before the script's own handler must not fail the collection (state stays empty).
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent history:restore -- --out .history-restore

      # Credentials only in this step's environment.
      - name: Collect
        env:
          HISTORY_FROM: .history-restore
          # [template-injection] step output mapped to env var — never inline in run:
          HISTORY_RESTORE_STATE: ${{ steps.history.outputs.state }}
          DATA_SOURCE: github
          CONFIG_DIR: ${{ github.workspace }}/deploy/${{ inputs.config-path }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          # Optional external providers: only read when enabled in providers.yaml.
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          HARBOR_ROBOT_NAME: ${{ secrets.HARBOR_ROBOT_NAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: npx tsx collector/src/index.ts --source github --config "$CONFIG_DIR" --out public/data

      - name: Validate snapshots
        run: npm run validate:snapshots

      - name: Job summary
        run: cat public/data/collection-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshots
          path: hub/public/data
          retention-days: 7
          if-no-files-found: error

      # Never after a failed (or crashed, empty state) restore: the fresh one-entry history would
      # become the newest artifact and the previous chain would be dropped for good.
      - name: Upload history artifact
        if: ${{ steps.history.outputs.state == 'restored' || steps.history.outputs.state == 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hub-history
          path: hub/public/data/history.json
          retention-days: 90
          if-no-files-found: warn

  # ==========================================================================
  # build — no secrets, no write permission
  # ==========================================================================
  build:
    name: Build site
    needs: [verify, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: hub
    steps:
      - name: Checkout hub (verified release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HUB_REPOSITORY }}
          ref: ${{ needs.verify.outputs.sha }}
          path: hub
          persist-credentials: false

      # Only policies.yaml: the "How to read" page explains the policies the collector used.
      - name: Checkout policies (calling repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy
          sparse-checkout: ${{ inputs.config-path }}/policies.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: hub/public/data

      - name: Build site
        env:
          # [template-injection] inputs mapped to env vars — never inline in run:
          SITE_URL: ${{ inputs.site-url }}
          BASE_PATH: /
          CATALOG_REPOSITORY: ${{ inputs.catalog-repository != '' && inputs.catalog-repository || github.repository }}
          # Same policies.yaml the Collect step read (required there, so it always exists).
          POLICIES_FILE: ${{ github.workspace }}/deploy/${{ inputs.config-path }}/policies.yaml
          # Cloudflare Access sits in front of this site: show who is signed in (initials only).
          PUBLIC_IDENTITY_SOURCE: cloudflare-access
        run: npm run build:site

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > dist/sbom.cdx.json

      - name: Scan output for secrets
        run: npm run scan:output

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: hub/dist
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # deploy — only the Cloudflare token; no hub code is executed here
  # ==========================================================================
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.deploy-environment }}
    permissions:
      contents: read
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          CF_PROJECT: ${{ inputs.cloudflare-project }}
          CF_ACCOUNT: ${{ inputs.cloudflare-account-id }}
        run: |
          [[ "$CF_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]] || { echo "::error::invalid cloudflare-project"; exit 1; }
          [[ "$CF_ACCOUNT" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::invalid cloudflare-account-id"; exit 1; }

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # Inputs validated above; wrangler version pinned.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ inputs.cloudflare-account-id }}
          wranglerVersion: '4.151.0'
          command: pages deploy dist --project-name=${{ inputs.cloudflare-project }} --branch=main --commit-dirty=true

  # ==========================================================================
  # notify — opt-in (input notifications = dry-run | send), after deploy. Only the Teams
  # secret, in one step; never the collector's credentials (ADR 0013). Inline here because a
  # reusable workflow called from another repository resolves ./ paths in the caller.
  # ==========================================================================
  notify:
    name: Notify
    needs: [verify, deploy]
    if: ${{ inputs.notifications == 'dry-run' || inputs.notifications == 'send' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout of the calling repository's configuration
      actions: read # restores this repository's own hub-notify-ledger artifact
    concurrency:
      group: hub-notify
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: hub
    steps:
      - name: Checkout hub (verified release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HUB_REPOSITORY }}
          ref: ${{ needs.verify.outputs.sha }}
          path: hub
          persist-credentials: false

      - name: Checkout configuration (calling repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deploy
          sparse-checkout: ${{ inputs.config-path }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: hub/.notify-in

      # Only the workflow token. Includes an earlier attempt of this run (re-run after a send).
      - name: Restore notification ledger
        id: ledger
        if: ${{ inputs.notifications == 'send' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent notify:restore-ledger -- --out .notify-ledger

      # The only step with the webhook URL. Values are never echoed or printed.
      - name: Notify
        id: notify
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # [template-injection] inputs and step outputs mapped to env — never inline in run:
          HUB_NOTIFICATIONS: ${{ inputs.notifications }}
          DATA_SOURCE: github
          # In send mode a crashed restore (empty state) counts as failed: nothing is sent.
          HUB_LEDGER_STATE: ${{ inputs.notifications == 'send' && (steps.ledger.outputs.state || 'failed') || 'skipped' }}
          CONFIG_DIR: ${{ github.workspace }}/deploy/${{ inputs.config-path }}
        run: npm run notify -- --snapshots .notify-in --config "$CONFIG_DIR" --out notify-out --ledger .notify-ledger/ledger.json

      - name: Scan payloads for secrets
        if: ${{ always() }}
        run: npm run scan:output -- notify-out

      - name: Upload payloads (for review)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notification-payloads
          path: hub/notify-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload notification ledger
        if: ${{ always() && steps.notify.outputs.ledger == 'saved' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hub-notify-ledger
          path: hub/.notify-ledger/ledger.json
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore
