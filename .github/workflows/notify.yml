# =============================================================================
# Workflow: Reusable — Notify (Microsoft Teams)
# Purpose:  After a deployment, posts one sanitised digest of the significant changes to a Teams
#           channel (Workflows webhook). Dry-run by default; never twice for the same change set.
# Security: ADR 0013. The webhook URL (TEAMS_WEBHOOK_URL) exists only in the "Notify" step; this
#           job never receives the collector's credentials. GITHUB_TOKEN (actions: read) is used
#           only to restore this repository's own hub-notify-ledger artifact.
# Called by: deploy-pages.yml (job notify, opt-in with the repository variable HUB_NOTIFICATIONS).
# =============================================================================
name: Reusable — Notify

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the snapshots artifact of this run'
        type: string
        required: true
      data-source:
        description: 'Data source actually used (mock | github)'
        type: string
        required: true
      mode:
        description: 'dry-run | send (the repository variable HUB_NOTIFICATIONS)'
        type: string
        required: true
    secrets:
      TEAMS_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      actions: read # restores this repository's own hub-notify-ledger artifact
    concurrency:
      group: hub-notify
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: .notify-in

      # Only the workflow token. Includes an earlier attempt of this run (re-run after a send).
      - name: Restore notification ledger
        id: ledger
        if: ${{ inputs.mode == 'send' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent notify:restore-ledger -- --out .notify-ledger

      # The only step with the webhook URL. Values are never echoed or printed.
      - name: Notify
        id: notify
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # [template-injection] inputs and step outputs mapped to env — never inline in run:
          HUB_NOTIFICATIONS: ${{ inputs.mode }}
          DATA_SOURCE: ${{ inputs.data-source }}
          # In send mode a crashed restore (empty state) counts as failed: nothing is sent.
          HUB_LEDGER_STATE: ${{ inputs.mode == 'send' && (steps.ledger.outputs.state || 'failed') || 'skipped' }}
        run: npm run notify -- --snapshots .notify-in --config config --out notify-out --ledger .notify-ledger/ledger.json

      - name: Scan payloads for secrets
        if: ${{ always() }}
        run: npm run scan:output -- notify-out

      - name: Upload payloads (for review)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notification-payloads
          path: notify-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload notification ledger
        if: ${{ always() && steps.notify.outputs.ledger == 'saved' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hub-notify-ledger
          path: .notify-ledger/ledger.json
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore
