name: An active exception accepts an overdue high alert and pauses its SLA
kind: security
now: '2026-01-15T12:00:00Z'
security:
  findings:
    - id: example-org/project-alpha-backend#code-scanning#15
      severity: high
      detectedAt: '@now-45d'
  exceptions:
    - id: EXC-CASE-001
      repository: example-org/project-alpha-backend
      source: code-scanning
      match: { alert: 15 }
      owner: team-alpha
      reason: Synthetic acceptance used only by this decision case.
      created: '@now-10d'
      expires: '@now+20d'
expect:
  status: green
  reasons: [security-exception-active, no-open-alerts]
  absent: [open-high-alerts, sla-overdue]
