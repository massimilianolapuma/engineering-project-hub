# yaml-language-server: $schema=../schema/project.schema.json
#
# Engineering Project Hub — project "project-alpha" (SYNTHETIC demo data: "example-org" is fictional).
# One file per project: the catalog editor (/catalog/) proposes changes as a pull request
# on this file. Reference: docs/configuration.md (EN) · docs/it/configuration.md (IT)

id: project-alpha
name: Project Alpha
description: Synthetic multi-repository payments platform used for the demo.
businessUnit: Payments
lifecycle: production

coordinator:
  repository: example-org/project-alpha-coordinator
  defaultBranch: main
  manifestPath: release-manifest.yaml
  notApplicableControls: [containerScanning]

components:
  - id: backend
    name: Backend API
    repository: example-org/project-alpha-backend
    type: service
    defaultBranch: main
    submodulePath: services/backend
  - id: frontend
    name: Frontend
    repository: example-org/project-alpha-frontend
    type: webapp
    defaultBranch: main
    submodulePath: apps/frontend
  - id: worker
    name: Settlement worker
    repository: example-org/project-alpha-worker
    type: worker
    defaultBranch: main
    submodulePath: services/worker
  - id: helm
    name: Helm deployment
    repository: example-org/project-alpha-helm
    type: deployment
    defaultBranch: main
    submodulePath: deploy/helm
    notApplicableControls: [containerScanning]
    versionSource: release # chart released and deployed on its own cadence

environments:
  - { id: dev, name: DEV }
  - { id: test, name: TEST }
  - { id: uat, name: UAT }
  - { id: prod, name: PROD }

trackedWorkflows:
  - id: ci
    name: Continuous Integration
    file: ci-main.yml
    critical: true
    appliesTo: [backend, frontend, worker]
  - id: release
    name: Release
    file: rel-release.yml
    critical: true
    appliesTo: [coordinator, backend, frontend, worker]
  - id: deploy
    name: Deployment
    file: cd.yml
    critical: true
    appliesTo: [helm]

securityControls:
  codeScanning: { required: true }
  secretScanning: { required: true }
  dependabot: { required: true }
  containerScanning: { required: true }
  iacScanning: { required: false }
  dast: { required: false }
  sbom: { required: false }
  artifactSignature: { required: false }
