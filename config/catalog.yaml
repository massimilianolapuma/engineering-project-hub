# yaml-language-server: $schema=./schema/catalog-settings.schema.json
#
# Engineering Project Hub — catalog settings.
# Projects live in config/projects/<id>.yaml (one file each).
# Discovery scans the owners below and publishes *proposals* (coordinators, monorepos,
# single repositories) to the catalog editor; nothing is added until a project file is saved.
# Reference: docs/configuration.md (EN) · docs/it/configuration.md (IT)

discovery:
  enabled: true
  owners: [example-org] # SYNTHETIC demo owner (mock data)
  includePrivate: false # forced to false while publication.audience is "public"
  includeForks: false
  includeArchived: false
  maxRepositories: 200
  # Hints read from custom properties and topics (read-only; only these keys are ever kept).
  topics: true
  customProperties: true # one extra call per scanned repository (Metadata: read)
  hints:
    projectProperty: hub-project # property → project id
    componentProperty: hub-component # property → component id
    typeProperty: hub-component-type # property → component type
    projectTopicPrefix: project- # topic "project-tools" → project "tools"
    typeTopicPrefix: type- # topic "type-worker" → type worker
